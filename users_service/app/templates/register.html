{% extends 'base.html' %}

{% block title %}Criar Conta - BlogNews{% endblock %}

{% block content %}
<div class="flex min-h-full flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <span class="text-4xl">🚀</span>
        <h2 class="mt-4 text-center text-3xl font-bold tracking-tight text-gray-900 dark:text-white">Crie sua conta</h2>
        <p class="mt-2 text-center text-sm text-gray-600 dark:text-slate-400">
            Já tem uma conta?
            <a href="/cadastro/login"
                class="font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 hover:underline">Faça
                login</a>
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div
            class="bg-white dark:bg-slate-900 py-8 px-4 shadow-xl sm:rounded-2xl sm:px-10 border border-gray-200 dark:border-slate-800 transition-colors">
            <form class="space-y-6" action="{{ url_for('auth.register') }}" method="POST">

                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 dark:text-slate-300">Nome de
                        Usuário</label>
                    <div class="mt-1">
                        <input id="username" name="username" type="text" required
                            class="block w-full appearance-none rounded-lg border border-gray-300 dark:border-slate-700 px-3 py-2 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 dark:bg-slate-950 dark:text-white sm:text-sm transition-colors">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 dark:text-slate-300">Email</label>
                    <div class="mt-1">
                        <input id="email" name="email" type="email" required
                            class="block w-full appearance-none rounded-lg border border-gray-300 dark:border-slate-700 px-3 py-2 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 dark:bg-slate-950 dark:text-white sm:text-sm transition-colors">
                    </div>
                </div>

                <div>
                    <label for="password"
                        class="block text-sm font-medium text-gray-700 dark:text-slate-300">Senha</label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" required
                            class="block w-full appearance-none rounded-lg border border-gray-300 dark:border-slate-700 px-3 py-2 placeholder-gray-400 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-indigo-500 dark:bg-slate-950 dark:text-white sm:text-sm transition-colors">
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="flex w-full justify-center rounded-lg border border-transparent bg-indigo-600 py-2.5 px-4 text-sm font-bold text-white shadow-lg shadow-indigo-500/20 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all">
                        Cadastrar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
