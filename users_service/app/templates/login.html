{% extends 'base.html' %}

{% block title %}Login - Blog{% endblock %}

{% block content %}

<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-lg border border-gray-200">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Acesse sua conta</h2>

    <form method="post">
        <div class="mb-4">
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Usuário</label>
            <input type="text" name="username" id="username" required
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
        </div>

        <div class="mb-6">
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
            <input type="password" name="password" id="password" required
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
        </div>

        <button type="submit"
            class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition">
            Entrar
        </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
        Não tem uma conta?
        <a href="/cadastro/register" class="text-indigo-600 hover:text-indigo-500 font-medium">Cadastre-se</a>
    </p>
</div>

{% endblock %}
