{% extends 'base.html' %}

{% block title %}Login - Blog{% endblock %}

{% block content %}

<div
    class="w-full max-w-md mx-auto my-auto bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-xl border border-gray-200 dark:border-slate-800 transition-colors">
    <div class="text-center mb-8">
        <span class="text-4xl">🔐</span>
        <h2 class="text-2xl font-bold text-gray-900 dark:text-white mt-4">Acesse sua conta</h2>
        <p class="text-sm text-gray-500 dark:text-slate-400">Bem-vindo de volta!</p>
    </div>

    <form method="post" action="{{ url_for('auth.login') }}" class="space-y-6">
        <div>
            <label for="username"
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1 ml-1">Usuário</label>
            <input type="text" name="username" id="username" required
                class="w-full px-4 py-2 border border-gray-300 dark:border-slate-700 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-slate-950 dark:text-white transition-colors">
        </div>

        <div>
            <label for="password"
                class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1 ml-1">Senha</label>
            <input type="password" name="password" id="password" required
                class="w-full px-4 py-2 border border-gray-300 dark:border-slate-700 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-slate-950 dark:text-white transition-colors">
        </div>

        <button type="submit"
            class="w-full bg-indigo-600 text-white font-bold py-2.5 px-4 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all shadow-lg shadow-indigo-500/20">
            Entrar
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600 dark:text-slate-400">
        Não tem uma conta?
        <a href="/cadastro/register"
            class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 font-bold hover:underline">Cadastre-se</a>
    </p>
</div>

{% endblock %}
