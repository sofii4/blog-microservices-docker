{% extends 'base.html' %}

{% block title %}Editar Notícia{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">

    <div class="md:flex md:items-center md:justify-between mb-8">
        <div class="min-w-0 flex-1">
            <h2
                class="text-2xl font-bold leading-7 text-gray-900 dark:text-white sm:truncate sm:text-3xl sm:tracking-tight">
                Editar Notícia
            </h2>
        </div>
    </div>

    <form method="post" enctype="multipart/form-data"
        class="bg-white dark:bg-slate-900 shadow-sm ring-1 ring-gray-900/5 dark:ring-slate-800 sm:rounded-xl md:col-span-2 transition-colors">
        <div class="px-4 py-6 sm:p-8">
            <div class="grid max-w-2xl grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">

                <div class="sm:col-span-4">
                    <label for="titulo"
                        class="block text-sm font-medium leading-6 text-gray-900 dark:text-slate-200">Título do
                        Post</label>
                    <div class="mt-2">
                        <input type="text" name="titulo" id="titulo" required value="{{ noticia.titulo }}"
                            class="block w-full rounded-md border-0 py-2 text-gray-900 dark:text-white shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-slate-700 placeholder:text-gray-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:focus:ring-indigo-500 dark:bg-slate-950 sm:text-sm sm:leading-6 px-3 transition-colors">
                    </div>
                </div>

                <div class="col-span-full">
                    <label class="block text-sm font-medium leading-6 text-gray-900 dark:text-slate-200">Imagem de
                        Capa</label>

                    {% if noticia.imagem %}
                    <div class="mb-4 mt-2">
                        <p class="text-xs text-gray-500 dark:text-slate-400 mb-2">Imagem Atual:</p>
                        <img src="/media/{{ noticia.imagem }}"
                            class="h-32 w-auto rounded-lg shadow-sm border border-gray-200 dark:border-slate-700">
                    </div>
                    {% endif %}

                    <div
                        class="mt-2 flex justify-center rounded-lg border border-dashed border-gray-900/25 dark:border-slate-600 px-6 py-10 bg-gray-50 dark:bg-slate-950/50 hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors">
                        <div class="text-center">
                            <div class="mt-4 flex text-sm leading-6 text-gray-600 dark:text-slate-400 justify-center">
                                <label for="imagem"
                                    class="relative cursor-pointer rounded-md font-semibold text-indigo-600 dark:text-indigo-400 focus-within:outline-none focus-within:ring-2 focus-within:ring-indigo-600 focus-within:ring-offset-2 hover:text-indigo-500">
                                    <span>Trocar imagem (opcional)</span>
                                    <input id="imagem" name="imagem" type="file" class="sr-only">
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-span-full">
                    <label for="conteudo"
                        class="block text-sm font-medium leading-6 text-gray-900 dark:text-slate-200">Conteúdo</label>
                    <div class="mt-2">
                        <textarea id="conteudo" name="conteudo" rows="10" required
                            class="block w-full rounded-md border-0 py-2 text-gray-900 dark:text-white shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-slate-700 placeholder:text-gray-400 dark:placeholder-slate-500 focus:ring-2 focus:ring-inset focus:ring-indigo-600 dark:focus:ring-indigo-500 dark:bg-slate-950 sm:text-sm sm:leading-6 px-3 transition-colors">{{ noticia.conteudo }}</textarea>
                    </div>
                </div>
            </div>
        </div>

        <div
            class="flex items-center justify-end gap-x-6 border-t border-gray-900/10 dark:border-slate-800 px-4 py-4 sm:px-8 bg-gray-50 dark:bg-slate-900/50 rounded-b-xl">
            <a href="/noticias/"
                class="text-sm font-semibold leading-6 text-gray-900 dark:text-slate-300 hover:text-gray-700 dark:hover:text-white transition-colors">Cancelar</a>
            <button type="submit"
                class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-all">
                Salvar Alterações
            </button>
        </div>
    </form>
</div>
{% endblock %}
