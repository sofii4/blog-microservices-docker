{% extends 'base.html' %}

{% block title %}Nova Publicação{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">

    <div class="md:flex md:items-center md:justify-between mb-8">
        <div class="min-w-0 flex-1">
            <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:truncate sm:text-3xl sm:tracking-tight">
                Criar Nova Notícia
            </h2>
        </div>
    </div>

    <form action="{{ url_for('noticias.criar_noticia') }}" method="post" enctype="multipart/form-data"
        class="bg-white shadow-sm ring-1 ring-gray-900/5 sm:rounded-xl md:col-span-2">
        <div class="px-4 py-6 sm:p-8">
            <div class="grid max-w-2xl grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">

                <div class="sm:col-span-4">
                    <label for="titulo" class="block text-sm font-medium leading-6 text-gray-900">Título do Post</label>
                    <div class="mt-2">
                        <input type="text" name="titulo" id="titulo" required
                            class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 px-3">
                    </div>
                </div>

                <div class="col-span-full">
                    <label for="imagem" class="block text-sm font-medium leading-6 text-gray-900">Imagem de Capa</label>
                    <div
                        class="mt-2 flex justify-center rounded-lg border border-dashed border-gray-900/25 px-6 py-10 bg-gray-50 hover:bg-gray-100 transition">
                        <div class="text-center">
                            <span class="text-4xl">🖼️</span>
                            <div class="mt-4 flex text-sm leading-6 text-gray-600 justify-center">
                                <label for="imagem"
                                    class="relative cursor-pointer rounded-md font-semibold text-indigo-600 focus-within:outline-none focus-within:ring-2 focus-within:ring-indigo-600 focus-within:ring-offset-2 hover:text-indigo-500">
                                    <span>Fazer upload de um arquivo</span>
                                    <input id="imagem" name="imagem" type="file" class="sr-only">
                                </label>
                            </div>
                            <p class="text-xs leading-5 text-gray-600">PNG, JPG, GIF até 5MB</p>
                        </div>
                    </div>
                </div>

                <div class="col-span-full">
                    <label for="conteudo" class="block text-sm font-medium leading-6 text-gray-900">Conteúdo</label>
                    <div class="mt-2">
                        <textarea id="conteudo" name="conteudo" rows="10" required
                            class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 px-3"></textarea>
                    </div>
                    <p class="mt-3 text-sm leading-6 text-gray-600">Escreva sua história aqui.</p>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-x-6 border-t border-gray-900/10 px-4 py-4 sm:px-8 bg-gray-50">
            <a href="/noticias/" class="text-sm font-semibold leading-6 text-gray-900">Cancelar</a>
            <button type="submit"
                class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition">
                Publicar Notícia
            </button>
        </div>
    </form>
</div>
{% endblock %}
