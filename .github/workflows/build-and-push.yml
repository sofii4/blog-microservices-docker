name: CI/CD - Construir e Publicar Imagens Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 1. OTIMIZAÇÃO: Cancela execuções em andamento se um novo commit for feito no mesmo PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Fazer checkout do código
        uses: actions/checkout@v4

      # 2. OTIMIZAÇÃO: Detecta quais pastas foram alteradas
      - name: Detectar mudanças nos serviços
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            users:
              - 'users_service/**'
            news:
              - 'news_service/**'

      - name: Configurar o Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. SEGURANÇA: Só faz login se não for um Pull Request
      - name: Login no Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. OTIMIZAÇÃO: Só constrói o Users Service se houver mudanças nele
      - name: Construir e Publicar (Users Service)
        if: steps.filter.outputs.users == 'true' || github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./users_service
          push: ${{ github.event_name != 'pull_request' }}
          tags: sofii4/blog-users-service:latest

      # 5. OTIMIZAÇÃO: Só constrói o News Service se houver mudanças nele
      - name: Construir e Publicar (News Service)
        if: steps.filter.outputs.news == 'true' || github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: ./news_service
          push: ${{ github.event_name != 'pull_request' }}
          tags: sofii4/blog-news-service:latest
          
