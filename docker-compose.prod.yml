# MODO DE PRODUÇÃO
# Baixa imagens do Docker Hub e roda na porta 80
# Para usar, rode com: docker compose -f docker-compose-prod.yml up -d

services:
  # TRAEFIK
  traefik:
    image: "traefik:v2.11"
    container_name: "traefik_proxy"
    restart: always
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "8000:80"
      - "8080:8080"   # Dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - proxy-net
    security_opt:
      - "label:disable"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # APLICAÇÃO DE NOTÍCIAS (FLASK)
  news-service:
    image: sofii4/blog-news-service:latest
    container_name: news_flask_service
    restart: always
    volumes:
      - news_media_volume:/app/app/static/uploads
    expose:
      - 8000
    environment:
      - MYSQL_DATABASE=${NEWS_DB_DATABASE}
      - MYSQL_USER=${NEWS_DB_USER}
      - MYSQL_PASSWORD=${NEWS_DB_PASSWORD}
      - MYSQL_HOST=news-db
      - FLASK_APP=${FLASK_APP}
      - FLASK_DEBUG=0 # Produção sempre 0
      - SECRET_KEY=${SECRET_KEY}
      - SESSION_TYPE=${SESSION_TYPE}
      - SESSION_REDIS=${SESSION_REDIS_URL}
    depends_on:
      news-db:
        condition: service_healthy
      redis-sessions:
        condition: service_healthy
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      # Rota Principal
      - "traefik.http.routers.news-router.rule=PathPrefix(`/noticias`)"
      - "traefik.http.routers.news-router.entrypoints=web"
      # Rota de Mídia
      - "traefik.http.routers.news-media-router.rule=PathPrefix(`/media`)"
      - "traefik.http.routers.news-media-router.entrypoints=web"
      - "traefik.http.services.news-service.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.75'
          memory: 512M

  # BANCO DE DADOS DO SERVIÇO NOTÍCIAS
  news-db:
    image: mariadb:10.6
    container_name: noticias_mariadb
    restart: always
    environment:
      MYSQL_DATABASE: ${NEWS_DB_DATABASE}
      MYSQL_USER: ${NEWS_DB_USER}
      MYSQL_PASSWORD: ${NEWS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${NEWS_DB_ROOT_PASSWORD}
    volumes:
      - news_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${NEWS_DB_USER}", "-p${NEWS_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1.5G
        reservations:
          cpus: '1'
          memory: 768M

  # APLICAÇÃO DE USUÁRIOS (FLASK)
  users-service:
    image: sofii4/blog-users-service:latest
    container_name: users_flask_service
    restart: always
    expose:
      - 8000
    environment:
      - MYSQL_DATABASE=${USERS_DB_DATABASE}
      - MYSQL_USER=${USERS_DB_USER}
      - MYSQL_PASSWORD=${USERS_DB_PASSWORD}
      - MYSQL_HOST=users-db
      - FLASK_APP=${FLASK_APP}
      - FLASK_DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
      - SESSION_TYPE=${SESSION_TYPE}
      - SESSION_REDIS=${SESSION_REDIS_URL}
    depends_on:
      users-db:
        condition: service_healthy
      redis-sessions:
        condition: service_healthy
    networks:
      - proxy-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-net"
      # Rota Cadastro
      - "traefik.http.routers.users-router.rule=PathPrefix(`/cadastro`)"
      - "traefik.http.routers.users-router.entrypoints=web"
      # Rota API 
      - "traefik.http.routers.users-api-router.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.users-api-router.entrypoints=web"
      - "traefik.http.services.users-service.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.75'
          memory: 512M

  # BANCO DE DADOS DE USUÁRIOS
  users-db:
    image: mariadb:10.6
    container_name: users_mariadb
    restart: always
    environment:
      MYSQL_DATABASE: ${USERS_DB_DATABASE}
      MYSQL_USER: ${USERS_DB_USER}
      MYSQL_PASSWORD: ${USERS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${USERS_DB_ROOT_PASSWORD}
    volumes:
      - users_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${USERS_DB_USER}", "-p${USERS_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1.5G
        reservations:
          cpus: '1'
          memory: 768M

  # BANCO DE SESSÕES COMPARTILHADO
  redis-sessions:
    image: "redis:alpine"
    container_name: redis_sessions_db
    restart: always
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  news_db_data:
  news_media_volume:
  users_db_data:

networks:
  proxy-net:
    driver: bridge
    name: proxy-net
  